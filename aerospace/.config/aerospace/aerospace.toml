after-login-command = []
after-startup-command = []

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
# default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

[workspace-to-monitor-force-assignment]
B = 'secondary'
O = 'secondary' # Screen Sharing
T = 'secondary' # iTerm too if you want
M = 'main'      # Slack/Mail too if you want
C = 'secondary' # AI Claude, Cursor etc

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0


[mode.main.binding]

# Service mode
alt-semicolon = 'mode service'

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
# alt-f = 'fullscreen'
alt-f = 'macos-native-fullscreen'
alt-shift-f = 'layout floating'

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
# shigt alt-h = ['focus left', 'move-mouse window-lazy-center']
# shigt alt-j = ['focus down', 'move-mouse window-lazy-center']
# shigt alt-k = ['focus up', 'move-mouse window-lazy-center']
# shigt alt-l = ['focus right', 'move-mouse window-lazy-center']

# Move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-left = 'move-node-to-monitor --wrap-around --focus-follows-window prev'
alt-shift-right = 'move-node-to-monitor --wrap-around --focus-follows-window next'

# Resize
alt-minus = 'resize smart -50' # shrink
alt-equal = 'resize smart +50' # grow (= is + without shift)
alt-0 = 'balance-sizes'        # reset/balance (like gg or 0 going to start)

alt-cmd-h = ['join-with left', 'mode main']
alt-cmd-a = ['join-with down', 'mode main']
alt-cmd-o = ['join-with up', 'mode main']
alt-cmd-e = ['join-with right', 'mode main']

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-c = 'workspace C'
alt-b = 'workspace B'
alt-m = 'workspace M'
alt-t = 'workspace T'
alt-o = 'workspace O'

# Move node to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-o = 'move-node-to-workspace O'

# Navigate
alt-tab = 'workspace-back-and-forth'
# alt-shift-left  = 'move-node-to-monitor --wrap-around --focus-follows-window prev'
# alt-shift-right = 'move-node-to-monitor --wrap-around --focus-follows-window next'
alt-cmd-left = 'move-workspace-to-monitor --wrap-around prev'
alt-cmd-right = 'move-workspace-to-monitor --wrap-around next'

alt-n = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
alt-p = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'

# alt-n = 'focus next --wrap-around --boundaries workspace'
# alt-p = 'focus prev --wrap-around --boundaries workspace'


[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
q = ['exec-and-forget killall AeroSpace && open -a AeroSpace', 'mode main']
o = ['close-all-windows-but-current', 'mode main']

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = "move-node-to-workspace T"

[[on-window-detected]]
if.app-id = 'com.apple.ScreenSharing'
run = "move-node-to-workspace O"

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = "move-node-to-workspace C"

# M
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = "move-node-to-workspace M"

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = "move-node-to-workspace M"

[[on-window-detected]]
if.app-id = 'com.viber.osx'
run = "move-node-to-workspace M"

[[on-window-detected]]
if.app-id = 'inc.wonder.roam'
run = "move-node-to-workspace M"

[[on-window-detected]]
if.app-id = 'com.AvivINC.Tab-for-Google-Translate'
run = 'layout floating'


# [[on-window-detected]]
# check-further-callbacks = true
# run = 'layout tiles horizontal vertical'
